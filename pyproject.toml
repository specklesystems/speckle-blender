[project]
name = "speckle-blender"
version = "3.0.0"
description = "Next-Gen Speckle connector for Blender!"
requires-python = ">=3.11.9, <4.0.0"
license = "Apache-2.0"
# pyarrow powers the specklepy parquet-bundle producer (specklepy's optional
# [bundle] extra); pinned here directly because the connector's runtime install
# uses `pip --no-deps` and cannot resolve extras.
dependencies = ["specklepy>=2026.6.0", "pyarrow>=17.0.0"]

[dependency-groups]
dev = ["fake-bpy-module-latest>=20260501", "ruff==0.14.14", "pre-commit>=4.0.1"]
