name: "Release workflow"
on:
  push:
    branches: ["installer-test/**"]
    tags: ["202[0-9].*.*"] # unprefixed CalVer, v-prefix dropped at 2026.9 (ENG-9392)

permissions: {}

jobs:
  build:
    name: Build Zip
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ZIP_NAME: "blender.zip"
      SEMVER: null
      FILE_VERSION: null
    outputs:
      semver: ${{ steps.set-version.outputs.semver }}
      fileVersion: ${{ steps.set-version.outputs.fileVersion }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🐍 Install uv and set the python version
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.11"
          enable-cache: false # releases are never built from a cache: https://docs.zizmor.sh/audits/#cache-poisoning

      - id: set-version
        name: Set version to output
        run: |
          TAG=${REF_NAME}
          if [[ "${REF}" != refs/tags/* ]]; then
            TAG="0.0.0.${RUN_NUMBER}"
          fi
          SEMVER="$TAG"
          FILE_VERSION=$(echo "$TAG" | sed -E 's/^([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          FILE_VERSION="$FILE_VERSION.${RUN_NUMBER}"

          echo "semver=$SEMVER" >> "$GITHUB_OUTPUT"
          echo "fileVersion=$FILE_VERSION" >> "$GITHUB_OUTPUT"

          echo $SEMVER
          echo $FILE_VERSION
        env:
          REF_NAME: ${{ github.ref_name }}
          REF: ${{ github.ref }}
          RUN_NUMBER: ${{ github.run_number }}

      - name: ✏ Patch Version
        run: python patch_version.py "$FILE_VERSION"
        env:
          FILE_VERSION: ${{ steps.set-version.outputs.fileVersion }}

      - name: 🔄 UV Sync
        run: uv sync --all-extras --dev

      - name: 📄 Export Package Dependencies
        run: ./export_dependencies.sh

      - name: 🗃 Zip Package
        run: zip -r "$ZIP_NAME" bpy_speckle -x '*/AGENTS.md'

      - name: ⬆️ Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: output-${{ steps.set-version.outputs.semver }}
          path: ${{env.ZIP_NAME}}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0 # no compression

  deploy-installers:
    runs-on: ubuntu-latest
    needs: build
    env:
      IS_PUBLIC_RELEASE: ${{ github.ref_type == 'tag' }}
    steps:
      - name: 🔫 Trigger Build Installer(s)
        uses: the-actions-org/workflow-dispatch@3133c5d135c7dbe4be4f9793872b6ef331b53bc7 # v4.0.0
        with:
          workflow: Build Installers
          repo: specklesystems/connector-installers
          token: ${{ secrets.CONNECTORS_GH_TOKEN }}
          inputs: '{
            "run_id": "${{ github.run_id }}",
            "semver": "${{ needs.build.outputs.semver }}",
            "file_version": "${{ needs.build.outputs.fileVersion }}",
            "repo": "${{ github.repository }}",
            "is_public_release": ${{ env.IS_PUBLIC_RELEASE }},
            "platforms": "win,mac"
            }'
          ref: main
          wait-for-completion: true
          wait-for-completion-interval: 10s
          wait-for-completion-timeout: 10m
          display-workflow-run-url: true
          display-workflow-run-url-interval: 10s

      - uses: geekyeggo/delete-artifact@176a747ab7e287e3ff4787bf8a148716375ca118 # v6.0.0
        with:
          name: output-*
