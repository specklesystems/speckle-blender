# Minimum colors for the risk check (risk-check/ in specklesystems/.github). A
# changed file that matches a path here gets at least that color, plus one
# comment that someone answers like an approver finding. Paths match from the
# repo root: "*" stays inside one directory, "**" spans any number of them.
# Everything under .github/ is red whatever this file says. A pull request that
# leaves this file unreadable fails the risk check.
yellow:
  # Agent configuration
  - '**/AGENTS.md'
  - '**/CLAUDE.md'
  - agents/**
  - '**/.agents/**'
  - '**/.claude/**'
  - '**/.codex/**'
  - '**/.omp/**'
  # Authentication code: the OAuth account-add flow and the account store
  - bpy_speckle/connector/authentication.py
  - bpy_speckle/connector/speckle_api/accounts.py
  # Betterleaks exceptions
  - '**/.betterleaks.toml'
  - '**/.betterleaksignore'
  - '**/.gitleaksignore'
  # Release: what release.yml bundles with the add-on (the dependencies come from
  # pyproject.toml), the version it writes, and the installer that fetches
  # specklepy on the user's machine
  - export_dependencies.sh
  - export_dependencies.ps1
  - pyproject.toml
  - patch_version.py
  - bpy_speckle/installer.py
red:
  - .github/**
# Machine accounts with write access: their color reviews and approvals never count.
bots:
  - SpeckleDevBot
