version: 2
updates:
  # Pin updates of the shared workflows in specklesystems/.github, one pull
  # request per new tag there. The cooldown lets speckle-next take a new pin
  # first (ADR-0002 amendment of 2026-11-24, ENG-11742). Dependabot security
  # updates are off in this repo, so `allow` keeps it to these pins.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    allow:
      - dependency-name: specklesystems/.github/*
    groups:
      dot-github:
        patterns:
          - specklesystems/.github/*
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
